[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adbx"
version = "1.0.0"
description = "Clone funzionale moderno di Alpha Four v3: database a celle di caratteri su SQLite (variante legacy 80x25)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vigliafg" }]
keywords = ["database", "alpha-four", "sqlite", "tui", "retro", "report"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = ["PyQt6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=7.2", "ruff>=0.4"]

[project.scripts]
adbx = "adbx.__main__:main"

[project.urls]
Documentation = "https://github.com/vigliafg/adbx/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adbx*"]

[tool.setuptools.package-data]
adbx = ["data/*.txt", "data/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
