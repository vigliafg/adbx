name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: python -m pytest
      - name: Smoke
        run: python -m adbx --smoke
      - name: Rendering canonico
        run: QT_QPA_PLATFORM=offscreen python tools/capture_ui.py --out /tmp/render
