name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON: "3.12"

jobs:
  linux:
    name: Linux (.deb, .AppImage, tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Verifica versione e tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"',
                              Path("src/adbx/__init__.py").read_text()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} diverso da v{version}"
          PY
      - name: Costruisci
        run: python tools/package.py linux
      - name: Smoke test degli artefatti
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          version=$(python -c "import adbx; print(adbx.__version__)")
          binary="dist/pyinstaller/linux/adbx-legacy/adbx-legacy"
          "$binary" --smoke | grep -q "griglia 80x25"
          "./dist/artifacts/adbx-legacy-${version}-linux-x86_64.AppImage" --smoke \
            | grep -q "griglia 80x25"
          dpkg-deb -x "dist/artifacts/adbx-legacy_${version}_amd64.deb" build/deb-smoke
          "build/deb-smoke/opt/adbx-legacy/adbx-legacy" --smoke | grep -q "griglia 80x25"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/artifacts/*
          if-no-files-found: error

  windows:
    name: Windows (installer NSIS, portable)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Verifica versione e tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path src\adbx\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME diverso da v$version" }
      - name: Costruisci
        run: python tools/package.py windows
      - name: Smoke test dell'eseguibile
        shell: pwsh
        run: |
          $exe = "dist\pyinstaller\windows\adbx-legacy\adbx-legacy.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "smoke fallito con codice $($proc.ExitCode)" }
          Get-ChildItem dist\artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/artifacts/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Verifica versione e tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"',
                              Path("src/adbx/__init__.py").read_text()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} diverso da v{version}"
          PY
      - name: Costruisci
        run: python tools/package.py macos
      - name: Smoke test del bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          "dist/pyinstaller/macos/adbx-legacy.app/Contents/MacOS/adbx-legacy" --smoke \
            | grep -q "griglia 80x25"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/artifacts/*
          if-no-files-found: error

  release:
    name: Pubblica la release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum e note
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          python tools/release_notes.py "$version" > release-notes.md
          cat release-notes.md
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "adbx-legacy ${version}" \
            --notes-file release-notes.md \
            dist/*
